[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/linux-backend",
    "crates/windows-backend",
    "crates/engine",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/SPOOKEYfr/Dremes"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
